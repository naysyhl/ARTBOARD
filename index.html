<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTBOARD – Jasa Desain Grafis dan Dokumen Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF1E4;--bg2:#F4E0C6;--card:#FFFAF3;--ink:#4B2E1A;--mut:#7D5A40;--br:#B5651D;--br2:#D98B3F;--br3:#F2C48D;--ln:#E8CFAE;--mint:#CDE8D6;--mintd:#2F6B47;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.brand b{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.1}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(251,241,228,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 24px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{font-size:24px;font-weight:800}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--mut);font-weight:500}
nav a:hover{background:var(--bg2)}
nav a.on{background:var(--br);color:#fff}
.btn{background:var(--br);color:#fff;border:2px solid var(--br);border-radius:14px;padding:10px 22px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,background .15s}
.btn:hover{background:#9C5416;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--br)}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{padding:6px 14px;font-size:15px}
main{max-width:1060px;margin:0 auto;padding:28px 24px 70px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center;padding:24px 0 10px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.pill{display:inline-block;background:var(--mint);color:var(--mintd);padding:4px 14px;border-radius:99px;font-weight:700;font-size:15px;margin-bottom:16px}
.hero h1{font-size:clamp(40px,7vw,68px);font-weight:800;margin-bottom:16px}
.hero h1 span{color:var(--br)}
.sub{max-width:52ch;color:var(--mut);font-size:18px}
.stage{position:relative;background:#fff;border:1px solid var(--ln);border-radius:36px 36px 120px 36px;padding:26px;display:grid;place-items:center;min-height:360px}
.stage img{width:min(250px,60%)}
.chip{position:absolute;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(120,70,20,.12)}
.chip.a{top:20px;left:16px}.chip.b{top:70px;right:14px}.chip.c{bottom:90px;left:12px}.chip.d{bottom:26px;right:70px;background:var(--mint);color:var(--mintd);border-color:transparent}
h2{font-size:clamp(28px,4.5vw,40px);font-weight:700;margin:56px 0 8px}
.lead{color:var(--mut);margin:0 0 20px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:18px;box-shadow:0 4px 14px rgba(120,70,20,.06)}
button.card{text-align:left;cursor:pointer;width:100%}
button.card:hover,.card.hv:hover{border-color:var(--br2);box-shadow:0 10px 22px rgba(120,70,20,.14)}
.card h3{font-size:19px;margin:12px 0 6px}
.card p{margin:0 0 12px;color:var(--mut);font-size:16px}
.ic{width:52px;height:52px;border-radius:16px;background:var(--br3);display:grid;place-items:center;font-size:28px}
.card:nth-child(3n+2) .ic{background:var(--mint)}
.card:nth-child(3n) .ic{background:#F9D9C4}
.price{color:var(--br);font-weight:700}
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
@media(max-width:760px){.flow{grid-template-columns:1fr}}
.flow li{counter-increment:s;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px 18px 18px 70px;position:relative;min-height:92px}
.flow li::before{content:counter(s);position:absolute;left:16px;top:16px;width:40px;height:40px;border-radius:50%;background:var(--br);color:#fff;display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",sans-serif}
.flow b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.flow span{color:var(--mut);font-size:15.5px}
.who{display:flex;flex-wrap:wrap;gap:10px}
.who span{background:var(--bg2);padding:8px 16px;border-radius:99px;font-weight:500}
.band{background:var(--br);color:#fff;border-radius:28px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:56px}
.band h3{font-size:28px}.band p{margin:6px 0 0;opacity:.92}
.band .btn{background:#fff;color:var(--br);border-color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
label{display:block;margin:14px 0 5px;font-weight:700;font-size:15.5px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--ln);border-radius:12px;padding:10px 14px}
input:focus,select:focus,textarea:focus{border-color:var(--br);outline:none;box-shadow:0 0 0 3px var(--br3)}
textarea{min-height:96px;resize:vertical}
.steps{display:flex;gap:8px;margin:12px 0 20px;flex-wrap:wrap}
.steps span{padding:5px 14px;border-radius:99px;background:var(--bg2);color:var(--mut);font-size:15px;font-weight:500}
.steps span.on{background:var(--br);color:#fff;font-weight:700}
.steps span.done{background:var(--mint);color:var(--mintd)}
.sel{border-color:var(--br2);background:#FFF3DF}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--ln)}
.row.tot{border:0;font-weight:800;font-size:21px;color:var(--br)}
.bar{display:flex;gap:5px;margin:14px 0 8px}
.bar i{flex:1;height:10px;border-radius:9px;background:var(--bg2)}
.bar i.on{background:var(--br2)}
.st{display:inline-block;padding:3px 14px;border-radius:99px;background:var(--br3);color:#6B3A0C;font-weight:700;font-size:14.5px;white-space:nowrap}
.st.done{background:var(--mint);color:var(--mintd)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{font-size:15px;color:var(--mut);margin:6px 0}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:26px;max-width:400px;width:92%;padding:26px;box-shadow:0 24px 60px rgba(75,46,26,.3)}
dialog::backdrop{background:rgba(75,46,26,.45)}
dialog img{width:70px;display:block;margin:0 auto 6px}
dialog h3{text-align:center;font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:99px;font-weight:700;z-index:9}
footer{text-align:center;color:var(--mut);padding:28px 20px;border-top:1px solid var(--ln);font-size:15px}
@media(prefers-reduced-motion:no-preference){.stage img{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}}
</style>
</head>

const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
let user=null,orders=[],draft=null;
try{user=JSON.parse(localStorage.getItem("ab_user")||"null");orders=JSON.parse(localStorage.getItem("ab_orders")||"[]")}catch(e){}
function save(){try{localStorage.setItem("ab_user",JSON.stringify(user));localStorage.setItem("ab_orders",JSON.stringify(orders))}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function newDraft(svc){return{step:svc?1:0,svc:svc||null,title:"",desc:"",qty:1,files:[],deadline:""}}
const today=()=>new Date().toISOString().slice(0,10);
function calc(d){
  const base=d.svc.p*d.qty;
  const days=(new Date(d.deadline)-new Date(today()))/864e5;
  const express=days<=1;
  const total=base+(express?base*.3:0);
  return{base,express,total,dp:total/2};
}
const ROUTES=[["beranda","Beranda"],["layanan","Layanan"],["pesan","Pesan"],["pesanan","Pesanan Saya"]];
const route=()=>location.hash.slice(1)||"beranda";
function render(){
  const r=route();
  $("#nav").innerHTML=ROUTES.map(([k,t])=>`<a href="#${k}" class="${r===k?"on":""}">${t}</a>`).join("");
  $("#auth").innerHTML=user?`<span style="margin-right:8px">Halo, <b>${esc(user.name)}</b></span><button class="btn ghost sm" id="out">Keluar</button>`:`<button class="btn sm" id="in">Masuk / Daftar</button>`;
  $("#app").innerHTML=({beranda:home,layanan:layanan,pesan:pesan,pesanan:pesananView}[r]||home)();
  bind();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

<h2>Alur pemesanan</h2>
<p class="lead">Enam langkah dari daftar sampai file akhir di tanganmu.</p>
<ol class="flow">
 <li><b>Masuk atau daftar</b><span>Buat akun supaya pesananmu tersimpan.</span></li>
 <li><b>Pilih kebutuhan</b><span>Pilih dari contoh layanan atau kirim Custom Request.</span></li>
 <li><b>Isi detail</b><span>Tulis brief, upload bahan, dan tentukan deadline.</span></li>
 <li><b>Konfirmasi dan bayar DP</b><span>Cek harga, lalu bayar DP 50% untuk mulai.</span></li>
 <li><b>Artboard mengerjakan</b><span>Kamu menerima hasil sementara dan bisa minta revisi.</span></li>
 <li><b>Pelunasan dan file akhir</b><span>Setelah setuju, lunasi dan unduh hasilnya.</span></li>
</ol>

<div class="grid" style="margin-top:14px">
 <div class="card"><div class="ic">⏱️</div><h3>Hemat waktu</h3><p>Tidak semua orang punya waktu atau keahlian desain. Serahkan ke kami.</p></div>
 <div class="card"><div class="ic">🧩</div><h3>Semua dalam satu layanan</h3><p>Desain dan pengolahan dokumen digital di satu tempat.</p></div>
 <div class="card"><div class="ic">🔍</div><h3>Dicek sebelum dikirim</h3><p>Isi, ejaan, tata letak, kualitas visual, dan hak pakai aset kami periksa.</p></div>
</div>

function layanan(){return`
<h2 style="margin-top:6px">Layanan</h2>
<p class="lead">Harga di bawah adalah harga mulai dari (contoh). Harga final dihitung saat konfirmasi.</p>

</div>

function pesan(){
  if(!user)return`<h2 style="margin-top:6px">Pesan layanan</h2><p class="lead">Masuk dulu supaya pesananmu tersimpan dan bisa dipantau.</p><button class="btn" id="in2">Masuk / Daftar</button>`;
  if(!draft)draft=newDraft();
  const d=draft,S=["Pilih kebutuhan","Detail dan bahan","Konfirmasi harga","Bayar DP"];
  let body="";
  if(d.step===0){
    body=`<p class="lead">Pilih dari contoh layanan, atau kirim Custom Request.</p><div class="grid">${ALL.map(s=>`<button class="card" data-pick="${s.id}"><div class="ic">${s.i}</div><h3>${s.n}</h3><span class="price">${rp(s.p)}</span></button>`).join("")}</div>`;
  }else if(d.step===1){
    const c=d.svc.id==="cus";
    body=`<div class="card sel"><b>${d.svc.i} ${d.svc.n}</b></div>
    <label for="t">Judul pesanan</label><input id="t" value="${esc(d.title)}" placeholder="Contoh: Poster Bazar Ramadan">
    <label for="ds">${c?"Jelaskan ide kamu":"Detail pesanan"}</label><textarea id="ds" placeholder="${c?"Ceritakan konsep, warna, ukuran, dan referensi":"Teks, ukuran, warna, dan hal lain yang perlu ada"}">${esc(d.desc)}</textarea>
    <div class="two"><div><label for="q">Jumlah</label><input id="q" type="number" min="1" max="50" value="${d.qty}"></div>
    <div><label for="dl">Deadline</label><input id="dl" type="date" min="${today()}" value="${d.deadline}"></div></div>
    <label for="fl">Upload bahan${c?" atau referensi":""}</label><input id="fl" type="file" multiple>
    <p class="note">${d.files.length?"File: "+d.files.map(esc).join(", "):"Belum ada file. Ini demo, file tidak dikirim ke server."}</p>
    <p class="note" id="err" style="color:#B3261E;font-weight:700"></p>
    <div class="acts"><button class="btn ghost" data-go="0">Kembali</button><button class="btn" data-go="2">Lanjut</button></div>`;
  }else if(d.step===2){
    const k=calc(d);
    body=`<div class="card"><div class="row"><span>${d.svc.n} x ${d.qty}</span><span>${rp(k.base)}</span></div>
    ${k.express?`<div class="row"><span>Express Service (deadline 1 hari atau kurang)</span><span>${rp(k.base*.3)}</span></div>`:""}
    <div class="row tot"><span>Total</span><span>${rp(k.total)}</span></div>
    <div class="row"><span>DP 50%</span><span>${rp(k.dp)}</span></div>
    <p class="note">${d.svc.id==="cus"?"Custom Request: tim akan menyesuaikan harga final setelah membaca idemu.":"Harga contoh untuk prototipe."}</p></div>
    <div class="acts"><button class="btn ghost" data-go="1">Ubah detail</button><button class="btn" data-go="3">Setuju dengan harga</button></div>`;
  }else{
    const k=calc(d);
    body=`<div class="card"><p style="color:var(--ink)">Bayar DP <b class="price">${rp(k.dp)}</b> untuk memulai pengerjaan.</p>
    <label for="pm">Metode bayar</label><select id="pm"><option>Transfer bank</option><option>QRIS</option><option>E-wallet</option></select>
    <p class="note">Pembayaran di sini hanya simulasi.</p></div>
    <div class="acts"><button class="btn ghost" data-go="2">Kembali</button><button class="btn" id="paydp">Bayar DP</button></div>`;
  }
  return`<h2 style="margin-top:6px">Pesan layanan</h2><div class="steps">${S.map((s,i)=>`<span class="${i===d.step?"on":i<d.step?"done":""}">${s}</span>`).join("")}</div>${body}`;
}

const STAGES=["DP dibayar","Dikerjakan","Hasil sementara","Revisi atau setuju","Pelunasan","Selesai"];
const IDX={working:1,preview:2,approved:4,done:5};
const LBL={working:"Sedang dikerjakan",preview:"Menunggu persetujuanmu",approved:"Menunggu pelunasan",done:"Selesai"};
function pesananView(){
  if(!user)return`<h2 style="margin-top:6px">Pesanan Saya</h2><p class="lead">Masuk untuk melihat status pesananmu.</p><button class="btn" id="in2">Masuk / Daftar</button>`;
  if(!orders.length)return`<h2 style="margin-top:6px">Pesanan Saya</h2><p class="lead">Belum ada pesanan. Pilih layanan untuk memulai.</p><a class="btn" href="#pesan">Buat pesanan</a>`;
  return`<h2 style="margin-top:6px;margin-bottom:16px">Pesanan Saya</h2>`+orders.slice().reverse().map(o=>{
    const ix=IDX[o.status];
    const acts={
      working:`<button class="btn ghost sm" data-o="${o.id}" data-a="send">Demo: kirim hasil sementara</button>`,
      preview:`<button class="btn sm" data-o="${o.id}" data-a="ok">Setuju, hasil akhir</button><button class="btn ghost sm" data-o="${o.id}" data-a="rev">Perlu revisi</button>`,
      approved:`<button class="btn sm" data-o="${o.id}" data-a="pay">Bayar pelunasan ${rp(o.total-o.dp)}</button>`,
      done:`<button class="btn sm" data-o="${o.id}" data-a="dl">Unduh file akhir</button>`
    }[o.status];
    return`<div class="card" style="margin-bottom:16px"><div class="row" style="border:0;align-items:center"><h3 style="font-size:21px;margin:0">${esc(o.title)}</h3><span class="st ${o.status==="done"?"done":""}">${LBL[o.status]}</span></div>
    <p class="note">${o.svc} · ${rp(o.total)} · deadline ${o.deadline}${o.rev?` · revisi ke-${o.rev}`:""}</p>
    <div class="bar">${STAGES.map((s,i)=>`<i class="${i<=ix?"on":""}" title="${s}"></i>`).join("")}</div>
    <p class="note"><b>${STAGES[ix]}</b></p><div class="acts">${acts}</div></div>`}).join("");
}

function bind(){
  $("#in")&&($("#in").onclick=openDlg);
  $("#in2")&&($("#in2").onclick=openDlg);
  $("#out")&&($("#out").onclick=()=>{user=null;draft=null;save();render();toast("Kamu sudah keluar")});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const s=ALL.find(x=>x.id===b.dataset.pick);
    if(!user){openDlg();return}
    draft=newDraft(s);location.hash="#pesan";render();
  });
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $("#paydp")&&($("#paydp").onclick=()=>{
    const k=calc(draft);
    orders.push({id:Date.now(),svc:draft.svc.n,title:draft.title,total:k.total,dp:k.dp,deadline:draft.deadline,status:"working",rev:0});
    draft=null;save();toast("DP diterima. Artboard mulai mengerjakan");location.hash="#pesanan";
  });
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const o=orders.find(x=>x.id==b.dataset.o),a=b.dataset.a;
    if(a==="send")o.status="preview";
    if(a==="ok")o.status="approved";
    if(a==="rev"){o.status="working";o.rev++;toast("Catatan revisi dikirim ke tim")}
    if(a==="pay"){o.status="done";toast("Pelunasan diterima")}
    if(a==="dl"){toast("Demo: file akhir dikirim lewat kanal aman");return}
    save();render();
  });
}
function go(n){
  const d=draft;
  if(d.step===1){
    d.title=$("#t").value.trim();d.desc=$("#ds").value.trim();d.qty=Math.max(1,+$("#q").value||1);d.deadline=$("#dl").value;
    d.files=[...$("#fl").files].map(f=>f.name).concat(d.files).slice(0,8);
    if(n>1){
      const e=!d.title?"Isi judul pesanan dulu.":!d.desc?"Isi detail pesanan dulu.":!d.deadline?"Pilih deadline dulu.":"";
      if(e){render();$("#err").textContent=e;return}
    }
  }
  if(n===0)draft=newDraft();else d.step=n;
  render();
}
const dlg=$("#dlg");
function openDlg(){dlg.showModal();$("#un").focus()}
$("#dno").onclick=()=>dlg.close();
$("#dok").onclick=()=>{
  const n=$("#un").value.trim(),e=$("#ue").value.trim();
  if(!n||!e){$("#dnote").textContent="Isi nama dan email dulu.";return}
  user={name:n,email:e};save();dlg.close();render();toast("Selamat datang, "+n);
};
render();
</script>
</body>
</html>
